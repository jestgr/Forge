# Builds the Forge Android app (Capacitor shell around app/) as a signed DEBUG APK and publishes it as a GitHub
# pre-release "debug-<run number>" (asset forge-debug-<N>.apk). Obtainium on Jeff's phone installs and updates
# from these releases; only the newest 3 are kept. Release files don't count against the Actions storage limit.
#
# Signing: every build (debug too) uses the ONE permanent Forge key, so each APK installs as an update.
# Secrets (copy in /etc/homelab/secrets.yaml): ANDROID_KEYSTORE_BASE64 (or the older ANDROID_KEYSTORE_B64),
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (falls back to the store password: the
# Forge keystore is PKCS12, where both are the same).
#
# Keep this file's name: versionCode = this workflow's run number, which must keep growing (a new workflow file
# would start again at 1 and Android would refuse the "downgrade").
name: Android APK

on:
  push:
    branches: [main, 'task/**', rework]
    paths:
      - 'app/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - name: Tests
        run: npm run check
      - run: npx cap sync android
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed debug APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          V=$(grep -oE "forge-v[0-9]+" app/js/version.js)
          export FORGE_VERSION_NAME="${V#forge-}.${{ github.run_number }}"
          (cd android && ./gradlew --no-daemon assembleDebug)
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Check signature (must be the Forge key)
        shell: bash
        run: |
          set -uo pipefail
          # Public SHA-256 of the Forge signing certificate (key in /etc/homelab/secrets.yaml).
          EXPECTED="0d94e328a6b85be558393b28bbd6ddcc4576b2a3e1027904a2bc7b4cbc23ad90"
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          OUT=$("$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1); RC=$?
          echo "$OUT" | grep -vE "^WARNING" | head -20
          [ $RC -eq 0 ] || { echo "::error::apksigner verify failed ($RC)"; exit 1; }
          echo "$OUT" | grep -qi "certificate SHA-256 digest: $EXPECTED" || { echo "::error::APK is not signed with the Forge key"; exit 1; }
          echo "Signed with the Forge key."
      - name: Publish pre-release (keep newest 3)
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk "forge-debug-$N.apk"
          gh release create "debug-$N" "forge-debug-$N.apk" --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "Debug build $N" --notes "Build $N from ${GITHUB_REF_NAME} (${GITHUB_SHA::7})."
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep -E '^debug-[0-9]+$' \
            | sort -t- -k2 -n -r | tail -n +4 | xargs -r -I{} gh release delete {} --cleanup-tag --yes
